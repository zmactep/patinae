name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev
            libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev
            libasound2-dev libfontconfig1-dev libgtk-3-dev libxdo-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check release metadata
        run: make check-release-metadata

      - name: Test core without plugin runtimes
        run: make test-core

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install test Python
        run: |
          uv python install 3.13
          echo "PYO3_PYTHON=$(uv python find --system --python-preference only-managed 3.13)" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --locked --workspace

      - name: Run workspace tests
        run: make test

      - name: Check Python crate
        run: cargo check --locked --manifest-path python/Cargo.toml

      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Check web WASM crate
        run: cargo check --locked --manifest-path web/Cargo.toml --target wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build widget assets
        run: |
          cd web && npm ci && npm run build && cd ..
          make widget-assets

      - name: Test bindings and installed wheel
        run: make test-bindings

      - name: Test dynamic plugin ABI
        run: make test-abi
