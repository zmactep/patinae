name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CI needs assertions and test coverage, not debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  checks:
    name: Formatting and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path python/Cargo.toml --all -- --check
          cargo fmt --manifest-path web/Cargo.toml --all -- --check
      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          workspaces: |
            .
            python
            web
      - name: Check release metadata
        run: make check-release-metadata

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check desktop GUI
        run: cargo clippy --locked -p patinae --all-targets -- -D warnings
      - name: Test GUI event dispatch
        run: cargo test --locked -p patinae --bin patinae app::events::tests -- --test-threads=1

  native:
    name: Native tests and Clippy
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libasound2-dev libfontconfig1-dev libgtk-3-dev libxdo-dev
          pkg-config --exists fontconfig

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install test Python
        run: |
          uv python install 3.13
          echo "PYO3_PYTHON=$(uv python find --system --python-preference only-managed 3.13)" >> "$GITHUB_ENV"

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # One workspace test pass covers the core, application and plugins.
      # test-core remains available locally for the configuration without plugins.
      - name: Run workspace tests
        run: make test

      # A real shared library is required; unit tests alone do not exercise dlopen.
      - name: Test dynamic plugin ABI
        run: make test-abi

  bindings:
    name: Web and Python bindings
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # These crates are separate Cargo workspaces, excluded from the root one.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            python
            web

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install test Python
        run: uv python install 3.13

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build widget assets
        working-directory: web
        run: npm ci && npm run build:ci

      # Reuse the web assets above. This runs Rust binding tests and tests an
      # installed debug wheel; preliminary cargo check passes add no coverage.
      - name: Test bindings and installed wheel
        run: make test-bindings

  # Preserve the existing required check name, covering every parallel lane.
  build:
    needs: [checks, desktop, native, bindings]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
