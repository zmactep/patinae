<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Patinae — Minimal Viewer</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #000;
                height: 100vh;
            }
            #viewer {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>
    <body>
        <div id="viewer"></div>

        <script type="module">
            import { PatinaeViewer } from "../dist/patinae-viewer.js";

            const viewer = new PatinaeViewer(document.getElementById("viewer"));
            await viewer.init();

            const reply = await viewer.loadUrl("https://models.rcsb.org/1IGT.bcif.gz", {
                name: "1IGT",
                format: "bcif",
            });

            if ("Err" in reply.result) throw new Error(reply.result.Err);
            for (const id of reply.task_ids) {
                const task = await viewer.tasks.wait(id);
                if (task.state !== "succeeded") throw new Error(`Task ${id} ${task.state}`);
            }

            await viewer.execute("bg_color white");
            viewer.execute("set shading_mode, skripkin");
            viewer.execute("set ambient, 0.8");
            viewer.execute("set silhouettes, on");
            viewer.execute("set silhouette_width, 1");
            viewer.execute("set silhouette_color, black");
        </script>
    </body>
</html>
