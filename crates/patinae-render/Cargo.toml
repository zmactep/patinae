[package]
name = "patinae-render"
description = "Greenfield GPU-first rendering crate for Patinae (used by patinae)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = []
# Read-only native budget queries. Browser and other portable clients opt out.
native-memory = ["dep:objc2-metal", "dep:ash", "dep:windows"]
# Build-time instrumentation: per-pass GPU timestamps + CPU phase markers
# exposed via `RenderState::take_frame_stats()`. Off by default so production
# builds don't pay for `TIMESTAMP_QUERY` feature requests or query writes in
# every pass. Enable for profiling / HUD / `bench/render_loop`.
stats = []

[dependencies]
patinae-mol = { workspace = true }
patinae-settings = { workspace = true }
patinae-algos = { workspace = true }
wgpu = { workspace = true }
lin_alg = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
image = { workspace = true }
pollster = "0.4"
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
half = "2"
patinae-io = { workspace = true }
image = { workspace = true }
naga = { version = "30", features = ["wgsl-in"] }
winit = "0.30"

[lints]
workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MTLDevice"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { version = "0.38", optional = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Graphics_Dxgi"] }
